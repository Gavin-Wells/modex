name: Modex macOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
      - run: npm install --no-audit --no-fund
      - run: npm test -- --run test/unit/modelswitchCli.test.ts test/unit/modelswitchTerminal.test.tsx
      - run: npm run prebuild
        env:
          USE_NPM_INSTALL_BUN: 'true'
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: modex-macos-${{ matrix.arch }}-preview
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
